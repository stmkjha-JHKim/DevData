<title>OraPulse - Troubleshooting Center</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg-1: #0b1220;
    --panel: #16213a;
    --panel-border: #26314d;
    --text-main: #e6ebf5;
    --text-sub: #8b96b3;
    --accent: #4f7cff;
    --accent-hover: #3d68f0;
    --warn-text: #f2c14e;
    --track-bg: #0d1526;
    --tag-bg: #1c2947;
    --tag-text: #9db4ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(79,124,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(79,124,255,0.08), transparent 40%),
      var(--bg-1);
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .topbar .title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    flex-shrink: 0;
    display: block;
  }

  .topbar h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .topbar p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-sub);
  }

  a.back-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    text-decoration: none;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    border-radius: 8px;
    padding: 9px 14px;
    transition: border-color 0.15s ease;
  }

  a.back-link:hover { border-color: var(--accent); }

  .search-box {
    margin-bottom: 22px;
  }

  .search-box input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .search-box input::placeholder { color: #4a5674; }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,124,255,0.15);
  }

  .category {
    margin-bottom: 28px;
  }

  .category-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--tag-text);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 10px;
    padding-left: 2px;
  }

  .faq-item {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .faq-q {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .faq-q .chevron {
    flex-shrink: 0;
    color: var(--text-sub);
    transition: transform 0.15s ease;
    font-size: 12px;
  }

  .faq-item.open .faq-q .chevron { transform: rotate(90deg); }

  .faq-a {
    display: none;
    padding: 0 16px 16px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-sub);
  }

  .faq-item.open .faq-a { display: block; }

  .faq-a code, .faq-a pre {
    font-family: "Consolas", "Menlo", "Courier New", monospace;
    font-size: 12.5px;
  }

  .faq-a code {
    background: var(--track-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--text-main);
  }

  .faq-a pre {
    background: var(--track-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-all;
    margin: 8px 0;
  }

  .faq-a ul {
    margin: 8px 0;
    padding-left: 20px;
  }

  .faq-a li { margin-bottom: 4px; }

  .empty-msg {
    color: var(--warn-text);
    font-size: 13px;
    text-align: center;
    padding: 30px 0;
  }

  .footer-note {
    margin-top: 24px;
    font-size: 11px;
    color: #5b6786;
    text-align: center;
    line-height: 1.6;
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="title">
      <img class="brand-icon" src="/favicon.svg" width="34" height="34" alt="OraPulse logo">
      <div>
        <h1>Troubleshooting Center</h1>
        <p>A collection of frequently asked questions about connection errors, permission issues, metric interpretation, and more</p>
      </div>
    </div>
    <a class="back-link" href="/dashboard.html">← Back to Dashboard</a>
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search by keyword (e.g. NJS-515, permissions, CPU, session expiry...)">
  </div>

  <div id="faqRoot"></div>

  <div class="footer-note">
    * If your issue isn't covered here, please contact the administrator with the full error message.
  </div>
</div>

<script>
  const FAQ = [
    {
      category: 'Connection Errors',
      items: [
        {
          q: `I'm getting "NJS-515: input string not in easy connect format"`,
          a: `
            node-oracledb's thin mode only understands Easy Connect syntax. The older
            notation that appends the SID with a colon, like <code>host:port:SID</code>,
            is not supported.
            <br><br>
            If you need to connect using a SID, use the full TNS connect descriptor form.
            <pre>(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=host)(PORT=port))(CONNECT_DATA=(SID=sid)))</pre>
            If the target DB uses a Service Name instead of a SID, you can use the simpler form below.
            <pre>host:port/service_name</pre>`
        },
        {
          q: `I'm getting "NJS-138: connections to this database server version are not supported by node-oracledb in Thin mode"`,
          a: `
            Thin mode only supports <b>Oracle Database 12.1 and later</b>. To connect to an
            older DB server (11g or earlier), you need to install the Oracle Instant Client
            and switch to "thick mode".
            <ul>
              <li>Download the Basic/Basic Light package from the Oracle Instant Client download page and extract it</li>
              <li>Set the <code>ORACLE_CLIENT_LIB_DIR</code> environment variable to the extracted path and restart the server</li>
            </ul>
            <pre># macOS / Linux
ORACLE_CLIENT_LIB_DIR=/path/to/instantclient npm start

# Windows (cmd)
set ORACLE_CLIENT_LIB_DIR=C:\\instantclient_21_x
npm start</pre>
            If the server console shows "Oracle Instant Client loaded (thick mode)", the switch was successful.`
        },
        {
          q: `The connection attempt hangs with no response, or times out after a long wait`,
          a: `
            This usually means the DB listener port (default 1521) is being blocked by a
            firewall or internal network policy. Ask your network administrator to allow
            access to that IP/port, or check whether the port is open yourself using the
            commands below.
            <pre># macOS / Linux
nc -vz &lt;IP&gt; &lt;PORT&gt;

# Windows (PowerShell)
Test-NetConnection -ComputerName &lt;IP&gt; -Port &lt;PORT&gt;</pre>`
        },
        {
          q: `My username/password look correct, but I get "ORA-01017: invalid username/password"`,
          a: `
            Check the following.
            <ul>
              <li>Passwords are case-sensitive.</li>
              <li>Confirm the account is not locked (<code>ORA-28000: the account is locked</code>)</li>
              <li>Confirm the password has not expired (<code>ORA-28001: the password has expired</code>)</li>
              <li>Confirm the SID/service name you're connecting to actually belongs to the database that account is on</li>
            </ul>`
        }
      ]
    },
    {
      category: 'Dashboard View Permissions',
      items: [
        {
          q: `A card shows "You do not have permission to view this."`,
          a: `
            Each card on the dashboard queries SYS-owned performance/dictionary views such as
            <code>v$instance</code>, <code>v$session</code>,
            <code>v$session_longops</code>, <code>v$system_event</code>,
            <code>v$sysmetric</code>, <code>v$sga</code>, <code>v$pgastat</code>, and
            <code>v$parameter</code>.
            A regular application account may not have SELECT privileges on these views by
            default. Ask your DBA to grant the following.
            <pre>GRANT SELECT_CATALOG_ROLE TO &lt;account_name&gt;;</pre>
            If granting the role isn't feasible, you can grant just the views you need
            individually. (You must prefix the view name with an underscore to reach the
            actual object name.)
            <pre>GRANT SELECT ON V_$SESSION TO &lt;account_name&gt;;
GRANT SELECT ON V_$SESSION_LONGOPS TO &lt;account_name&gt;;
GRANT SELECT ON V_$SYSTEM_EVENT TO &lt;account_name&gt;;
GRANT SELECT ON V_$SYSMETRIC TO &lt;account_name&gt;;</pre>`
        },
        {
          q: `Why does the "Invalid Object" card run into permission issues more often than others?`,
          a: `
            This card queries <code>dba_objects</code>, which is a DBA-only view, so
            <code>SELECT_CATALOG_ROLE</code> alone is sometimes not enough. In that case you
            may need the <code>SELECT ANY DICTIONARY</code> privilege or a DBA role grant.
            On a production database, security policy may restrict granting this privilege
            at all, so check with your DBA whether it's truly necessary before requesting it.`
        }
      ]
    },
    {
      category: 'Interpreting Performance Metrics',
      items: [
        {
          q: `CPU usage shows close to 100% — how should I check this?`,
          a: `
            This value is not the CPU usage of the Oracle process alone — it's the
            <b>CPU usage of the entire host the DB is installed on</b> (the 'Host CPU
            Utilization (%)' metric from <code>v$sysmetric</code>). Another process on the
            host may be the one consuming CPU. Start by checking the "Long Running Session"
            card for long-running operations and the "Current Session List" for a high
            number of ACTIVE sessions, then use <code>top</code>/<code>htop</code> at the OS
            level if needed to see which process is using CPU.`
        },
        {
          q: `What should I do when a session appears in the "Blocking Session" card?`,
          a: `
            This card shows a situation where one session (the blocking session) is holding
            a lock that is stopping another session (the waiting session) from proceeding.
            If the wait is short, it often resolves on its own shortly after. If it persists
            for a long time, check what the blocking session is doing, and if necessary ask
            your DBA to terminate the session (<code>ALTER SYSTEM KILL SESSION</code>).
            Killing a session on a production database can roll back an in-progress
            transaction, so use judgment before doing so.`
        },
        {
          q: `How should I interpret the values in the "Top 5 Wait Events" table?`,
          a: `
            This table shows values <b>accumulated since the instance was started</b> (they
            keep growing until the next restart). It's not meant to show a problem at a
            specific point in time — use it to get the big picture of which type of wait
            (disk I/O, locks, network, etc.) the database has spent the most time on overall.
            Idle-class events (such as waiting for a client response) are normal waits and
            are excluded from this list.`
        },
        {
          q: `What is the popup that appears when I click a session in the "Current Session List"?`,
          a: `
            Clicking a session row queries <code>gv$session</code> for that SID's detailed
            wait information (event, status, wait time, P1/P2/P3, etc.) and displays it. It
            then uses the P1 value as the file number (FILE_NO) and the P2 value as the block
            number (BLOCK_NO) to query <code>dba_extents</code>, and also shows which
            table/index (segment) that file/block actually belongs to. However, whether P1/P2
            actually represent a file#/block# depends on the type of wait event (for
            block-related waits such as buffer busy waits or read by other session, P1=file#
            and P2=block# generally hold true, but for other events they may mean something
            else, in which case the lookup result may not be meaningful). Looking up the
            file/block object requires SELECT privilege on <code>dba_extents</code> (DBA
            privileges or <code>SELECT ANY DICTIONARY</code>).`
        },
        {
          q: `Why does the "Current Session List" only show ACTIVE sessions?`,
          a: `
            Since wait/blocking diagnosis mostly requires sessions that are actually
            executing something right now, the list is narrowed to USER sessions with
            <code>status = 'ACTIVE'</code>. It's also sorted so that sessions with a SQL_ID
            (sessions with SQL actually running) appear before sessions without one, so the
            sessions worth clicking into for diagnosis are right at the top of the list.`
        },
        {
          q: `Memory usage shows "unable to determine the configured memory limit"`,
          a: `
            This appears when the <code>MEMORY_TARGET</code>, <code>MEMORY_MAX_TARGET</code>,
            <code>SGA_MAX_SIZE</code>, and <code>PGA_AGGREGATE_TARGET</code> parameters are
            all 0, or when you don't have permission to query those parameters. The database
            may be configured to set each memory component manually rather than using
            automatic memory management. In that case, just refer to the used-MB value.`
        }
      ]
    },
    {
      category: 'Licensing and Security',
      items: [
        {
          q: `Does querying performance-related views (v$sysmetric, etc.) have licensing implications?`,
          a: `
            Querying views tied to the AWR infrastructure, such as <code>v$sysmetric</code>
            and <code>v$session_longops</code>, may fall under a separate license scope such
            as the Oracle Diagnostics Pack. This depends on your organization's Oracle
            licensing policy, so we recommend confirming with your DBA/license administrator
            before rolling this dashboard out against a production database.`
        },
        {
          q: `The information shown in "Current Session List" or "Blocking Session" seems sensitive — is that okay?`,
          a: `
            These cards display other users' session information as-is, including their
            login account, machine, and running program. Since this can expose what other
            users are working on, restrict access to the dashboard to people who are
            authorized to see it.`
        }
      ]
    },
    {
      category: 'Sessions and Login',
      items: [
        {
          q: `I was returned to the login screen after about 30 minutes`,
          a: `
            For security, the server session is configured to expire automatically after 30
            minutes of inactivity. Simply log in again. To adjust the expiry time, change the
            <code>cookie.maxAge</code> value in the <code>session()</code> configuration in
            <code>server.js</code>.`
        },
        {
          q: `I had to log in again after restarting the server`,
          a: `
            Connection details (including the account and password) are stored temporarily
            only in the server's in-memory session, not on disk. It's expected behavior for
            the session to disappear along with the memory when the server restarts.`
        }
      ]
    }
  ];

  const faqRoot = document.getElementById('faqRoot');
  const searchInput = document.getElementById('searchInput');

  function render(filterText) {
    const keyword = (filterText || '').trim().toLowerCase();
    faqRoot.innerHTML = '';
    let totalShown = 0;

    FAQ.forEach(cat => {
      const matchedItems = cat.items.filter(item => {
        if (!keyword) return true;
        const haystack = (item.q + ' ' + item.a).toLowerCase();
        return haystack.includes(keyword);
      });

      if (matchedItems.length === 0) return;
      totalShown += matchedItems.length;

      const catDiv = document.createElement('div');
      catDiv.className = 'category';

      const title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = cat.category;
      catDiv.appendChild(title);

      matchedItems.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'faq-item';

        const btn = document.createElement('button');
        btn.className = 'faq-q';
        btn.innerHTML = `<span>${item.q}</span><span class="chevron">▶</span>`;
        btn.addEventListener('click', () => {
          itemDiv.classList.toggle('open');
        });

        const answer = document.createElement('div');
        answer.className = 'faq-a';
        answer.innerHTML = item.a;

        itemDiv.appendChild(btn);
        itemDiv.appendChild(answer);
        catDiv.appendChild(itemDiv);
      });

      faqRoot.appendChild(catDiv);
    });

    if (totalShown === 0) {
      faqRoot.innerHTML = '<div class="empty-msg">No results found. Try a different keyword.</div>';
    }
  }

  searchInput.addEventListener('input', () => render(searchInput.value));

  render('');
</script>
